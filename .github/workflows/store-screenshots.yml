name: Store screenshots (mobile)

# Captures literal 1:1 store screenshots for the EduNav mobile app from a
# real iOS simulator + Android emulator. The screenshots produced here are
# what we upload to App Store Connect and the Play Console.
#
# This workflow runs on a macOS GitHub-hosted runner because:
#   - iOS simulators only exist on macOS (Xcode requirement).
#   - The Android emulator (with KVM/HAXM acceleration) needs nested virt
#     that the macOS runner image provides via `reactivecircus/android-emulator-runner`.
#
# Trigger it manually from the Actions tab when you need to refresh the
# screenshots in `artifacts/edunav-mobile/assets/store/`. The new PNGs are
# uploaded as a workflow artifact you can download and commit.
#
# It also runs automatically on the first of every month so the listing PNGs
# stay current without anyone having to remember to push the button — the
# scheduled run uses the same default iOS simulator as a manual run with no
# inputs.

on:
  workflow_dispatch:
    inputs:
      ios_device:
        description: "iOS simulator name (must be 6.7'' / 1290x2796 class)"
        required: false
        default: "iPhone 15 Pro Max"
  schedule:
    # 07:00 UTC on the 1st of every month. Scheduled runs have no
    # `inputs.*`, so every consumer of `inputs.ios_device` below falls
    # back to "iPhone 15 Pro Max" via the `||` default.
    - cron: "0 7 1 * *"

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator screenshots
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/edunav-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Boot iOS simulator (${{ inputs.ios_device || 'iPhone 15 Pro Max' }})
        env:
          DEVICE_NAME: ${{ inputs.ios_device || 'iPhone 15 Pro Max' }}
        run: |
          set -euo pipefail
          # `xcrun simctl list devices available` prints sections like:
          #   -- iOS 17.5 --
          #       iPhone 15 Pro Max (XXXXXXXX-...) (Shutdown)
          # Take the first match (newest runtime is listed first).
          DEVICE_UDID=$(xcrun simctl list devices available \
            | grep -F "$DEVICE_NAME (" \
            | head -n1 \
            | grep -oE '[0-9A-F-]{36}' \
            | head -n1)
          if [ -z "$DEVICE_UDID" ]; then
            echo "No simulator named '$DEVICE_NAME' available." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      - name: Build iOS simulator app (EAS local, screenshots profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `eas build --local` runs the prebuild + Xcode build on this
          # runner (no remote EAS credits needed). Output is an .app folder.
          npx --yes eas-cli build \
            --platform ios \
            --profile screenshots \
            --local \
            --non-interactive \
            --output ./build-ios.tar.gz
          mkdir -p ./build-ios && tar -xzf ./build-ios.tar.gz -C ./build-ios
          APP_PATH=$(find ./build-ios -name "*.app" -maxdepth 4 | head -n1)
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

      - name: Capture iOS screenshots
        run: node scripts/store-screens/capture-simulator.mjs --platform=ios --device="${{ inputs.ios_device || 'iPhone 15 Pro Max' }}"

      - name: Verify iOS screenshot set
        run: node scripts/store-screens/verify-screens.mjs --platform=ios

      - name: Upload iOS screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-ios
          path: artifacts/edunav-mobile/assets/store/ios/*.png
          if-no-files-found: error

  android:
    name: Android emulator screenshots
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/edunav-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Build Android APK (EAS local, screenshots profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli build \
            --platform android \
            --profile screenshots \
            --local \
            --non-interactive \
            --output ./build-android.apk

      - name: Boot Android emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          # macos-14 is Apple Silicon — x86_64 system images won't boot under
          # the host's hypervisor, so we use the ARM64 image which both Apple
          # Silicon and AVD Manager support natively for API 34+.
          arch: arm64-v8a
          profile: pixel_6
          # 1080x1920 is the Play Store minimum for phone screenshots.
          # pixel_6 emulator already renders at 1080x2400, which we crop to
          # 1080x1920 in capture-simulator.mjs.
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          working-directory: artifacts/edunav-mobile
          script: |
            adb wait-for-device
            adb install -r ./build-android.apk
            node scripts/store-screens/capture-simulator.mjs --platform=android
            node scripts/store-screens/verify-screens.mjs --platform=android

      - name: Refresh Play Store feature graphic and 512×512 icon
        # Regenerates the two non-screenshot Play assets from the same brand
        # values (color, wordmark, tagline) used by the screenshots, so they
        # never drift when branding changes.
        run: node scripts/store-screens/generate-play-extras.mjs

      - name: Verify Play Store feature graphic and 512×512 icon
        # Asserts both PNGs exist at the exact required dimensions (1024×500
        # and 512×512) and have no alpha channel — Play Console rejects the
        # upload otherwise. Runs right after generate-play-extras.mjs so a
        # bad output fails CI before the auto-PR opens.
        run: node scripts/store-screens/verify-play-extras.mjs

      - name: Upload Android screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-android
          path: artifacts/edunav-mobile/assets/store/android/*.png
          if-no-files-found: error

  open-pr:
    name: Open PR with refreshed screenshots
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Build the PR body BEFORE downloading the new screenshots so we can
      # tell which routes already have a screenshot on the base branch (i.e.
      # have a "before" thumbnail to show) versus which ones are brand new.
      # `actions/checkout@v4` above laid down the base branch's contents, so
      # `fs.existsSync` here reflects "what's on base today" — once the
      # download steps run they'd overwrite the working tree with the new
      # PNGs and we'd lose that signal.
      - name: Build PR body with before/after thumbnails
        id: build_body
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          IOS_DEVICE: ${{ inputs.ios_device || 'iPhone 15 Pro Max' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const path = require('path');

          const repo = process.env.REPO;
          const baseRef = process.env.BASE_REF;
          const refreshRef = 'store-screenshots/refresh';
          const eventName = process.env.EVENT_NAME;
          const iosDevice = process.env.IOS_DEVICE;
          const runUrl = process.env.RUN_URL;
          const storeDir = 'artifacts/edunav-mobile/assets/store';

          // Read the canonical route list shared with capture-simulator.mjs,
          // verify-screens.mjs, and generate.mjs so the # column, deep links,
          // and filenames here can never drift from what was actually captured.
          const routes = JSON.parse(
            fs.readFileSync(
              'artifacts/edunav-mobile/scripts/store-screens/routes.json',
              'utf8',
            ),
          ).map((r) => [`${r.slug}.png`, `edunav-mobile://${r.path}`]);

          // refs/heads/<ref>/ form is used so the slash in
          // `store-screenshots/refresh` is parsed unambiguously by GitHub.
          const rawUrl = (ref, platform, filename) =>
            `https://raw.githubusercontent.com/${repo}/refs/heads/${ref}/${storeDir}/${platform}/${filename}`;

          const thumb = (ref, platform, filename, label, width = 200) => {
            const url = rawUrl(ref, platform, filename);
            return `<a href="${url}"><img width="${width}" alt="${label}" src="${url}"></a>`;
          };

          const baseHas = (platform, filename) =>
            fs.existsSync(path.join(storeDir, platform, filename));

          const renderTable = (platform) => {
            const lines = [
              '| # | Deep link | Before | After |',
              '| --- | --- | --- | --- |',
            ];
            routes.forEach(([filename, link], i) => {
              const before = baseHas(platform, filename)
                ? thumb(baseRef, platform, filename, `${platform} before ${filename}`)
                : '_(new route — no prior screenshot)_';
              const after = thumb(refreshRef, platform, filename, `${platform} after ${filename}`);
              lines.push(`| ${i + 1} | \`${link}\` | ${before} | ${after} |`);
            });
            return lines.join('\n');
          };

          const extras = [
            ['feature-graphic.png', 400, 'Play Store feature graphic'],
            ['icon-512.png', 128, 'Play Store 512x512 icon'],
          ];
          const extrasLines = [
            '| Asset | Before | After |',
            '| --- | --- | --- |',
          ];
          for (const [filename, width, label] of extras) {
            const before = baseHas('android', filename)
              ? thumb(baseRef, 'android', filename, `${label} (before)`, width)
              : '_(new asset — no prior version)_';
            const after = thumb(refreshRef, 'android', filename, `${label} (after)`, width);
            extrasLines.push(`| \`android/${filename}\` | ${before} | ${after} |`);
          }

          const body = [
            `Auto-generated by the **Store screenshots (mobile)** workflow.`,
            ``,
            `- Triggered from branch: \`${baseRef}\``,
            `- Trigger: \`${eventName}\` (scheduled monthly run, or manual via Actions tab)`,
            `- iOS simulator: \`${iosDevice}\``,
            `- Actions run: ${runUrl}`,
            ``,
            `The diff is limited to \`artifacts/edunav-mobile/assets/store/\` so you can`,
            `eyeball the visual changes only.`,
            ``,
            `## Routes captured`,
            ``,
            `Each row shows the screenshot currently on \`${baseRef}\` (Before) next to the`,
            `refreshed version on \`${refreshRef}\` (After), so visual regressions stand out`,
            `at a glance. New routes with no prior screenshot show only the After cell.`,
            `Click any thumbnail to open the full-resolution PNG.`,
            ``,
            `### iOS`,
            ``,
            renderTable('ios'),
            ``,
            `### Android`,
            ``,
            renderTable('android'),
            ``,
            `## Play Store extras (Android only)`,
            ``,
            `The two non-screenshot Play Store assets (\`android/feature-graphic.png\` and`,
            `\`android/icon-512.png\`) are also refreshed by`,
            `\`scripts/store-screens/generate-play-extras.mjs\` using the same brand color,`,
            `wordmark, and tagline as the screenshots, so they stay in sync when branding`,
            `changes.`,
            ``,
            extrasLines.join('\n'),
            ``,
          ].join('\n');

          // Multiline GITHUB_OUTPUT entries need a heredoc-style delimiter.
          // Pick one that can't appear in markdown bodies in practice.
          process.stdout.write(`body<<__PR_BODY_EOF__\n${body}\n__PR_BODY_EOF__\n`);
          NODE

      - name: Download iOS screenshots
        uses: actions/download-artifact@v4
        with:
          name: store-screenshots-ios
          path: artifacts/edunav-mobile/assets/store/ios

      - name: Download Android screenshots
        uses: actions/download-artifact@v4
        with:
          name: store-screenshots-android
          path: artifacts/edunav-mobile/assets/store/android

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: store-screenshots/refresh
          base: ${{ github.ref_name }}
          commit-message: "Refresh store screenshots"
          title: "Refresh store screenshots"
          # Restrict the commit to the screenshot folder so reviewers only see
          # the visual diff (no stray changes from the runner workspace).
          add-paths: |
            artifacts/edunav-mobile/assets/store/ios/*.png
            artifacts/edunav-mobile/assets/store/android/*.png
          delete-branch: true
          body: ${{ steps.build_body.outputs.body }}

  notify-on-scheduled-failure:
    # Opens (or comments on an existing) GitHub issue when the *scheduled*
    # monthly run fails, so a silent breakage — expired EAS credentials,
    # simulator boot failures, missing Xcode runtimes, etc. — doesn't rot
    # for weeks unnoticed. Manual `workflow_dispatch` runs are skipped:
    # whoever clicked Run can already see the red check in the Actions tab,
    # so notifying them again would just be noise.
    name: Notify on scheduled failure
    needs: [ios, android, open-pr]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'store-screenshots';
            // Stable prefix used both when opening the issue and when looking
            // for an existing one to comment on. Keeping it constant means a
            // human can rename the issue (e.g. add the root cause) without
            // breaking dedup, as long as they don't strip this prefix.
            const titlePrefix = 'Scheduled store screenshot refresh failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `${titlePrefix} (${today})`;
            const body = [
              `The scheduled monthly run of **Store screenshots (mobile)** failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Workflow file: \`.github/workflows/store-screenshots.yml\``,
              `- Triggered by: \`${context.eventName}\` on \`${context.ref}\``,
              ``,
              `Common causes: expired \`EXPO_TOKEN\`, iOS simulator no longer available on the runner image, Android emulator boot timeout, or a verify step failing because a route's UI changed. Open the run logs above to see which job failed.`,
              ``,
              `Re-run the workflow manually from the Actions tab once the cause is fixed; close this issue when the next scheduled run goes green.`,
            ].join('\n');

            // Reuse an open tracking issue if one already exists so we don't
            // spam a fresh issue every month while the same breakage drags on.
            // Match on BOTH the label and the title prefix so an unrelated
            // issue that happens to share the label can't accidentally absorb
            // our failure comments.
            const { data: candidates } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });
            const existing = candidates.find(
              (issue) => !issue.pull_request && issue.title.startsWith(titlePrefix),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another scheduled run failed on ${today}: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${existing.number}.`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.info(`Opened tracking issue #${created.number}.`);

  notify-on-scheduled-success:
    # Closes any open `store-screenshots` tracking issue once a *scheduled*
    # run goes green end-to-end (ios + android + open-pr all succeeded). This
    # makes the issue trustworthy as a live signal: open == the schedule is
    # actually broken right now. Manual `workflow_dispatch` runs are skipped
    # because a one-off green run from a developer's machine doesn't prove the
    # cron schedule itself is healthy — only a successful scheduled run does.
    name: Notify on scheduled success
    needs: [ios, android, open-pr]
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close open tracking issues
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'store-screenshots';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            // Match the same filter the failure job uses to open issues, so
            // we only auto-close issues this workflow actually owns. Skip
            // pull requests (the issues API returns them too) and ignore any
            // unrelated issue that happens to share the label.
            const titlePrefix = 'Scheduled store screenshot refresh failed';
            const { data: candidates } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });
            const tracking = candidates.filter(
              (issue) => !issue.pull_request && issue.title.startsWith(titlePrefix),
            );

            if (tracking.length === 0) {
              core.info('No open store-screenshots tracking issues to close.');
              return;
            }

            for (const issue of tracking) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Scheduled run on ${today} succeeded — closing automatically. Green run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed tracking issue #${issue.number}.`);
            }
