name: API server tests

# Runs the api-server unit-test suite on every push and PR. Today this
# protects the CSP report dedupe behaviour in
# `artifacts/api-server/src/routes/csp-report.ts` from silently regressing —
# without these tests, a future refactor of the route or the logger could
# accidentally turn the per-window summary back into per-request log spam.

on:
  push:
    paths:
      - "artifacts/api-server/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-server-tests.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-server-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: api-server unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run api-server typecheck
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Run api-server tests
        run: pnpm --filter @workspace/api-server run test
